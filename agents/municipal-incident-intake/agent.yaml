kind: hosted
name: municipal-incident-intake
description: Extracts municipal incident type, location, assets, risks, missing details, and summary.
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: "0.5"
  memory: 1Gi
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: ENABLE_INSTRUMENTATION
    value: "true"
  - name: OTEL_SERVICE_NAME
    value: municipal-incident-intake
  - name: OTEL_TRACES_SAMPLER
    value: always_on
  - name: ENABLE_SENSITIVE_DATA
    value: "true"