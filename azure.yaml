# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.25.3'
    extensions:
        azure.ai.agents: '>=0.1.27-preview'
name: urban-incident-agents
metadata:
    template: urban-incident-agents@0.1.0
services:
    municipal-incident-intake:
        project: ./agents/municipal-incident-intake
        host: azure.ai.agent
        language: python
        docker:
            path: Dockerfile
            context: ../..
            platform: amd64
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
    municipal-incident-notification:
        project: ./agents/municipal-incident-notification
        host: azure.ai.agent
        language: python
        docker:
            path: Dockerfile
            context: ../..
            platform: amd64
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
    municipal-incident-orchestrator:
        project: ./agents/municipal-incident-orchestrator
        host: azure.ai.agent
        language: python
        docker:
            path: Dockerfile
            context: ../..
            platform: amd64
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
    municipal-incident-routing:
        project: ./agents/municipal-incident-routing
        host: azure.ai.agent
        language: python
        docker:
            path: Dockerfile
            context: ../..
            platform: amd64
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
