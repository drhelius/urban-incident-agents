[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-incident-agents"
version = "0.1.0"
description = "Municipal incident triage and routing workflow built with Microsoft Agent Framework and Microsoft Foundry hosted agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nacho Sanchez Gines" }]
dependencies = [
    "agent-framework-core>=1.7.0",
    "agent-framework-foundry>=1.7.0",
    "azure-identity>=1.21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]
frontend = [
    "streamlit>=1.37.0",
]
hosted = [
    "agent-framework-foundry-hosting>=1.0.0a260528",
    "mcp>=1.24.0",
]
observability = [
    "azure-monitor-opentelemetry>=1.7.0",
]
dev = [
    "debugpy>=1.8.0",
    "ruff>=0.6.0",
]

[project.scripts]
urban-incidents = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["agents"]
include = ["orchestrator*"]
exclude = ["frontend*"]

[tool.ruff]
line-length = 100
target-version = "py312"
